[package]
name = "uwifin-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "request-id", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "chrono", "macros", "migrate", "json"] }
alloy-primitives = { version = "=0.8.26", default-features = false, features = ["std", "k256"] }
argon2 = "0.6"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "=0.15.7"
anyhow = "1.0"

[dev-dependencies]
http-body-util = "0.1"

[[bin]]
name = "uwifin-api"
path = "src/main.rs"
